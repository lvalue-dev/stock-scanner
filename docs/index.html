<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📈 주식 스캐너</title>
<style>
:root{--bg:#0d0d1f;--bg2:#12122a;--bg3:#1a1a38;--bd:#2a2a50;--tx:#dde1f0;--tx2:#888;
  --pu:#8080ff;--gn:#00cc66;--rd:#cc3333;--or:#ffaa00;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
/* ── PIN ── */
#pin-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.pin-box{text-align:center;padding:32px 24px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;width:300px}
.pin-box h2{color:var(--pu);font-size:22px;margin-bottom:8px}
.pin-box p{color:var(--tx2);font-size:13px;margin-bottom:24px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--bd);transition:.2s}
.pin-dot.filled{background:var(--pu)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{padding:16px;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;
  color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;transition:.15s}
.pin-pad button:active{background:var(--pu);color:#fff}
.pin-error{color:var(--rd);font-size:13px;margin-top:12px;min-height:18px}
.pin-hint{color:var(--tx2);font-size:11px;margin-top:12px}
/* ── Layout ── */
#app{display:none;max-width:520px;margin:0 auto}
header{background:linear-gradient(135deg,#1a1a40,#2a2a60);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
header h1{font-size:18px;color:var(--pu)}
header .meta{font-size:11px;color:var(--tx2);text-align:right}
header .meta b{color:var(--tx)}
.lock-btn{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:16px;padding:4px}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px 4px;font-size:12px;font-weight:400;color:var(--tx2);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.tabs button.active{font-weight:700;color:var(--pu);border-bottom-color:var(--pu)}
.tab-body{padding:14px}
/* ── Cards ── */
.card{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:12px;border-left:3px solid var(--gn)}
.card.sell{border-left-color:var(--rd)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-name{font-size:15px;font-weight:700}
.card-code{font-size:11px;color:var(--tx2);margin-left:6px}
.score-pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.score-high{background:#00cc6633;color:var(--gn)}
.score-mid{background:#ffaa0033;color:var(--or)}
.score-low{background:#cc333333;color:var(--rd)}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.price{font-size:22px;font-weight:700;color:#00ff88}
.change{font-size:13px}
.up{color:var(--rd)}.dn{color:#4488ff}.flat{color:var(--tx2)}
.prediction{font-size:13px;font-weight:600;color:var(--or);margin-bottom:10px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.zone{background:var(--bg3);border-radius:8px;padding:8px 10px}
.zone-label{font-size:10px;color:var(--tx2);margin-bottom:3px}
.zone-val{font-size:13px;font-weight:600}
.zone-buy .zone-val{color:var(--gn)}
.zone-sell .zone-val{color:var(--rd)}
.zone-target .zone-val{color:var(--pu)}
.zone-stop .zone-val{color:var(--or)}
.signals{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sig{padding:2px 8px;border-radius:12px;font-size:11px;background:#8080ff22;color:var(--pu)}
.indicators{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ind{background:var(--bg3);border-radius:6px;padding:6px 8px;text-align:center}
.ind-label{font-size:10px;color:var(--tx2)}
.ind-val{font-size:13px;font-weight:600;margin-top:2px}
/* ── History ── */
.hist-filter{display:flex;gap:8px;margin-bottom:12px}
.hist-filter input,.hist-filter select{flex:1;padding:8px 10px;background:var(--bg3);
  border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 6px;text-align:left;color:var(--tx2);border-bottom:1px solid var(--bd);font-weight:500}
td{padding:8px 6px;border-bottom:1px solid #1a1a2e}
tr:last-child td{border-bottom:none}
/* ── Portfolio ── */
.pf-summary{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:14px}
.pf-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pf-label{font-size:12px;color:var(--tx2)}
.pf-val{font-size:14px;font-weight:600}
.pf-total{font-size:20px;font-weight:700;margin-top:8px}
.pf-add-form{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:14px}
.pf-add-form h3{font-size:14px;margin-bottom:10px;color:var(--pu)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input,select{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--bd);
  border-radius:8px;color:var(--tx);font-size:13px}
/* ── Buttons ── */
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.btn-green{background:var(--gn)}
.btn-blue{background:#2255cc}
.btn-red{background:var(--rd)}
.btn-sm{padding:6px 12px;width:auto;font-size:12px;border-radius:6px}
/* ── Settings ── */
.setting-group{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:12px}
.setting-group h3{font-size:13px;color:var(--tx2);margin-bottom:12px;font-weight:500}
label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.form-gap{margin-bottom:12px}
/* ── Empty ── */
.empty{text-align:center;color:var(--tx2);padding:48px 20px;font-size:14px}
.badge{display:inline-block;background:var(--rd);color:#fff;border-radius:10px;
  font-size:10px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.all-item{background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--bd);transition:.15s}
.mkt-kospi{font-size:9px;padding:1px 5px;border-radius:4px;background:#2255cc33;color:#88aaff;margin-left:4px}
.mkt-kosdaq{font-size:9px;padding:1px 5px;border-radius:4px;background:#00cc6633;color:var(--gn);margin-left:4px}
.mkt-tab{padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s}
.mkt-tab.active{background:var(--pu);color:#fff;border-color:var(--pu)}
.mkt-mkt-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);font-size:12px;cursor:pointer;transition:.15s}
.mkt-mkt-btn.active{background:#2255cc;color:#fff;border-color:#2255cc}
.tabs button{font-size:11px}
</style>
</head>
<body>

<!-- PIN Screen -->
<div id="pin-screen">
  <div class="pin-box">
    <h2>📈 주식 스캐너</h2>
    <p id="pin-desc">PIN을 입력하세요</p>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
      <button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
      <button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
      <button onclick="pinKey('C')" style="font-size:14px">지우기</button>
      <button onclick="pinKey('0')">0</button>
      <button onclick="pinKey('OK')" style="background:#2255cc;color:#fff">확인</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="pin-hint" id="pin-hint"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>📈 주식 스캐너
      <span id="live-badge" style="display:none;font-size:11px;background:#00cc6633;color:#00cc66;padding:2px 8px;border-radius:10px;font-weight:500;vertical-align:middle;margin-left:6px">● LIVE</span>
    </h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="meta">
        <div>마지막 스캔</div>
        <div><b id="scan-time">—</b></div>
      </div>
      <button class="lock-btn" onclick="lock()" title="잠금">🔒</button>
    </div>
  </header>

  <div class="tabs">
    <button class="active" onclick="switchTab('signals',this)">신호<span class="badge" id="sig-badge" style="display:none">0</span></button>
    <button onclick="switchTab('all',this)">전체</button>
    <button onclick="switchTab('history',this)">히스토리</button>
    <button onclick="switchTab('portfolio',this)">포트폴리오</button>
    <button onclick="switchTab('market',this)">시장현황</button>
    <button onclick="switchTab('settings',this)">설정</button>
  </div>

  <!-- 신호 탭 -->
  <div class="tab-body" id="tab-signals">
    <div id="signals-list"><div class="empty">데이터를 불러오는 중...</div></div>
  </div>

  <!-- 전체종목 탭 -->
  <div class="tab-body" id="tab-all" style="display:none">
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <select id="all-market" onchange="renderAllStocks()" style="flex:1">
        <option value="">전체 시장</option>
        <option value="KOSPI">KOSPI</option>
        <option value="KOSDAQ">KOSDAQ</option>
      </select>
      <select id="all-sort" onchange="renderAllStocks()" style="flex:1">
        <option value="score">점수순</option>
        <option value="change">등락율순</option>
        <option value="rsi">RSI순</option>
      </select>
    </div>
    <input type="text" id="all-search" placeholder="종목명·코드 검색..."
           oninput="renderAllStocks()"
           style="width:100%;margin-bottom:10px;padding:8px 12px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px">
    <div id="all-count" style="font-size:11px;color:var(--tx2);margin-bottom:8px"></div>
    <div id="all-list"><div class="empty">데이터를 불러오는 중...</div></div>
  </div>

  <!-- 히스토리 탭 -->
  <div class="tab-body" id="tab-history" style="display:none">
    <div class="hist-filter">
      <input type="text" id="hist-search" placeholder="종목 검색..." oninput="renderHistory()">
      <select id="hist-days" onchange="renderHistory()">
        <option value="7">7일</option><option value="30" selected>30일</option>
        <option value="90">90일</option><option value="999">전체</option>
      </select>
    </div>
    <div id="history-table"></div>
  </div>

  <!-- 포트폴리오 탭 -->
  <div class="tab-body" id="tab-portfolio" style="display:none">
    <div class="pf-summary" id="pf-summary"></div>
    <div class="pf-add-form">
      <h3>➕ 종목 추가</h3>
      <div class="form-row">
        <div><label>종목코드</label><input id="pf-code" placeholder="예: 005930" maxlength="6"></div>
        <div><label>종목명</label><input id="pf-name" placeholder="예: 삼성전자"></div>
      </div>
      <div class="form-row">
        <div><label>수량</label><input id="pf-qty" type="number" placeholder="10"></div>
        <div><label>평균매수가</label><input id="pf-price" type="number" placeholder="72000"></div>
      </div>
      <button class="btn btn-green" onclick="addHolding()">추가</button>
    </div>
    <div id="pf-holdings"></div>
  </div>

  <!-- 시장현황 탭 -->
  <div class="tab-body" id="tab-market" style="display:none">
    <!-- 서브탭 -->
    <div style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px">
      <button class="mkt-tab active" onclick="setMktTab('up',this)">📈 상승</button>
      <button class="mkt-tab" onclick="setMktTab('dn',this)">📉 하락</button>
      <button class="mkt-tab" onclick="setMktTab('vol',this)">🔥 거래량</button>
      <button class="mkt-tab" onclick="setMktTab('watch',this)">⭐ 관심종목</button>
    </div>
    <!-- 시장 선택 -->
    <div id="mkt-market-btns" style="display:flex;gap:6px;margin-bottom:10px">
      <button class="mkt-mkt-btn active" id="mkt-J" onclick="setMktMarket('J',this)">KOSPI</button>
      <button class="mkt-mkt-btn" id="mkt-Q" onclick="setMktMarket('Q',this)">KOSDAQ</button>
    </div>
    <!-- 콘텐츠 -->
    <div id="mkt-content"><div class="empty">로딩 중...</div></div>
    <div id="mkt-status" style="font-size:11px;color:var(--tx2);margin-top:8px;min-height:16px"></div>
  </div>

  <!-- 설정 탭 -->
  <div class="tab-body" id="tab-settings" style="display:none">
    <div class="setting-group">
      <h3>🔐 PIN 변경</h3>
      <div class="form-gap"><label>현재 PIN</label><input id="cur-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="form-gap"><label>새 PIN (4자리)</label><input id="new-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="form-gap"><label>새 PIN 확인</label><input id="new-pin2" type="password" maxlength="4" inputmode="numeric"></div>
      <button class="btn btn-blue" onclick="changePin()">PIN 변경</button>
    </div>
    <div class="setting-group">
      <h3>💼 포트폴리오 백업</h3>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-blue btn-sm" onclick="exportPortfolio()">JSON 내보내기</button>
        <button class="btn btn-blue btn-sm" onclick="document.getElementById('pf-import').click()">JSON 가져오기</button>
        <input id="pf-import" type="file" accept=".json" style="display:none" onchange="importPortfolio(event)">
      </div>
    </div>
    <div class="setting-group">
      <h3>📡 실시간 시세 (한국투자 Open API)</h3>
      <div class="form-gap"><label>App Key</label><input id="rt-key" type="password" placeholder="한국투자 App Key" autocomplete="off"></div>
      <div class="form-gap"><label>App Secret</label><input id="rt-sec" type="password" placeholder="한국투자 App Secret" autocomplete="off"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-green btn-sm" id="rt-start-btn" onclick="saveAndStartLive()">▶ 저장 후 실시간 시작</button>
        <button class="btn btn-red btn-sm" id="rt-stop-btn" onclick="stopLive()" style="display:none">⏹ 중단</button>
      </div>
      <div id="rt-status" style="font-size:11px;color:var(--tx2);margin-top:8px;min-height:16px"></div>
    </div>
    <div class="setting-group">
      <h3>ℹ️ 정보</h3>
      <div style="font-size:12px;color:var(--tx2);line-height:1.9">
        • GitHub Actions가 장중 30분마다 자동 스캔<br>
        • 분석: RSI·MACD·볼린저밴드·이평선·스토캐스틱·거래량<br>
        • Discord 웹훅으로 신호 즉시 알림<br>
        • 포트폴리오는 이 기기의 브라우저에 저장됩니다
      </div>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let results = {signals:[], scan_time:'', signal_count:0};
let allStocks = [];
let histLog = [];
let portfolio = JSON.parse(localStorage.getItem('pf_holdings') || '[]');
let serverPortfolio = null;

// ── 실시간 시세 ───────────────────────────────────────────────────────────────
const KI_API = 'https://openapi.koreainvestment.com:9443';
const RT_INTERVAL = 30000; // 30초

let rtAppKey = '';
let rtAppSecret = '';
let rtToken = null;
let rtTokenExpiry = 0;
let rtPrices = {};      // { code: { price, change, changePct, sign } }
let rtInterval = null;
let rtStop = false;

function isMarketOpen() {
  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const day = kst.getUTCDay();
  const t = kst.getUTCHours() * 100 + kst.getUTCMinutes();
  return day >= 1 && day <= 5 && t >= 900 && t < 1531;
}

function setRtStatus(msg) {
  const el = document.getElementById('rt-status');
  if (el) el.textContent = msg;
}

async function getRtToken() {
  const now = Date.now();
  // 1) 메모리 캐시
  if (rtToken && now < rtTokenExpiry) return rtToken;
  // 2) localStorage 캐시 (같은 appKey로 발급된 토큰만 재사용)
  const lsToken  = localStorage.getItem('ki_token');
  const lsExpiry = parseInt(localStorage.getItem('ki_token_exp') || '0');
  const lsKey    = localStorage.getItem('ki_token_key');
  if (lsToken && now < lsExpiry && lsKey === rtAppKey) {
    rtToken = lsToken; rtTokenExpiry = lsExpiry;
    return rtToken;
  }
  // 3) 신규 발급
  const res = await fetch(`${KI_API}/oauth2/tokenP`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ grant_type: 'client_credentials', appkey: rtAppKey, appsecret: rtAppSecret }),
  });
  if (!res.ok) throw new Error(`토큰 HTTP ${res.status}`);
  const d = await res.json();
  if (!d.access_token) throw new Error('토큰 발급 실패');
  rtToken = d.access_token;
  rtTokenExpiry = now + 23 * 3600 * 1000;
  localStorage.setItem('ki_token',     rtToken);
  localStorage.setItem('ki_token_exp', String(rtTokenExpiry));
  localStorage.setItem('ki_token_key', rtAppKey);
  return rtToken;
}

async function pollLivePrices() {
  setRtStatus('조회 중...');
  try {
    const token = await getRtToken();
    // signals + allStocks 합집합 코드 수집
    const codeSet = new Set();
    (results.signals || []).forEach(s => codeSet.add(s.code));
    (allStocks || []).forEach(s => codeSet.add(s.code));
    const codes = [...codeSet];

    for (const code of codes) {
      if (rtStop) break;
      try {
        const p = new URLSearchParams({ fid_cond_mrkt_div_code: 'J', fid_input_iscd: code });
        const res = await fetch(`${KI_API}/uapi/domestic-stock/v1/quotations/inquire-price?${p}`, {
          headers: {
            authorization: `Bearer ${token}`,
            appkey: rtAppKey,
            appsecret: rtAppSecret,
            tr_id: 'FHKST01010100',
            custtype: 'P',
          },
        });
        if (res.ok) {
          const data = await res.json();
          if (data.rt_cd === '0') {
            const out = data.output;
            rtPrices[code] = {
              price: parseInt(out.stck_prpr),
              change: parseInt(out.prdy_vrss),
              changePct: parseFloat(out.prdy_ctrt),
              sign: out.prdy_vrss_sign, // 1:상한 2:상승 3:보합 4:하한 5:하락
            };
          }
        }
      } catch { /* 개별 종목 실패 무시 */ }
      await new Promise(r => setTimeout(r, 100));
    }

    if (!rtStop) {
      const now = new Date().toLocaleTimeString('ko-KR');
      const marketTag = isMarketOpen() ? ' 🟢장중' : ' ⚫장외';
      setRtStatus(`마지막 업데이트: ${now}${marketTag}`);
      renderSignals();
      renderAllStocks();
      renderPortfolio();
    }
  } catch (e) {
    setRtStatus(`오류: ${e.message}`);
  }
}

async function saveAndStartLive() {
  const key = (document.getElementById('rt-key').value || '').trim();
  const sec = (document.getElementById('rt-sec').value || '').trim();
  if (!key || !sec) { alert('App Key와 Secret을 입력하세요'); return; }
  // 키가 바뀐 경우 토큰 캐시 무효화
  if (key !== rtAppKey) {
    rtToken = null; rtTokenExpiry = 0;
    wsApprovalKey = null;
    ['ki_token','ki_token_exp','ki_token_key','ki_approval','ki_approval_exp','ki_approval_key']

  rtAppKey = key;

// ── Auth ─────────────────────────────────────────────────────────────────────
let pinBuffer = '';
const SALT = 'stock-scanner-2025';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function updateDots() {
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i<pinBuffer.length);
}

function pinKey(k) {
  if(k==='C') { pinBuffer=pinBuffer.slice(0,-1); updateDots(); return; }
  if(k==='OK') { submitPin(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer+=k; updateDots();
  if(pinBuffer.length===4) setTimeout(submitPin,150);
}

async function submitPin() {
  const stored = localStorage.getItem('pin_hash');
  const hash = await sha256(pinBuffer + SALT);
  if(!stored) {
    localStorage.setItem('pin_hash', hash);
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='block';
    localStorage.setItem('pin_set','1');
    init();
  } else if(hash===stored) {
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('pin-error').textContent='PIN이 틀렸습니다';
    pinBuffer=''; updateDots();
    setTimeout(()=>document.getElementById('pin-error').textContent='', 1500);
  }
}

function lock() {
  pinBuffer=''; updateDots();
  document.getElementById('pin-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function changePin() {
  const cur=document.getElementById('cur-pin').value;
  const n1=document.getElementById('new-pin').value;
  const n2=document.getElementById('new-pin2').value;
  if(n1.length!==4||!/^\d{4}$/.test(n1)){alert('새 PIN은 숫자 4자리여야 합니다');return;}
  if(n1!==n2){alert('새 PIN이 일치하지 않습니다');return;}
  const curHash=await sha256(cur+SALT);
  if(curHash!==localStorage.getItem('pin_hash')){alert('현재 PIN이 틀렸습니다');return;}
  localStorage.setItem('pin_hash', await sha256(n1+SALT));
  alert('PIN이 변경됐습니다');
  ['cur-pin','new-pin','new-pin2'].forEach(id=>document.getElementById(id).value='');
}

async function fetchJSON(path) {
  try {
    const r = await fetch(path+'?t='+Date.now());
    if(!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function init() {
  const [r, h, p] = await Promise.all([
    fetchJSON('data/results.json'),
    fetchJSON('data/signals_log.json'),
    fetchJSON('data/portfolio.json'),
  ]);
  if(r) {
    results=r;
    document.getElementById('scan-time').textContent=r.scan_time||'—';
    allStocks=r.all_stocks||[];
  }
  if(h) histLog=h;
  serverPortfolio=p;
  renderSignals();
  renderHistory();
  renderPortfolio();
  loadRtKeys();
  if(!localStorage.getItem('pin_set'))
    document.getElementById('pin-hint').textContent='※ 처음 사용: PIN을 입력하면 자동 설정됩니다';
}

function addHolding() {
  const code=document.getElementById('pf-code').value.trim();
  const name=document.getElementById('pf-name').value.trim();
  const qty=parseInt(document.getElementById('pf-qty').value);
  const avg=parseInt(document.getElementById('pf-price').value);
  if(!code||!name||!qty||!avg){alert('모든 항목을 입력하세요');return;}
  const existing=portfolio.find(h=>h.code===code);
  if(existing){
    const total=existing.qty+qty;
    existing.avg_price=Math.round((existing.qty*existing.avg_price+qty*avg)/total);
    existing.qty=total;
  } else {
    portfolio.push({id:Date.now().toString(),code,name,qty,avg_price:avg});
  }
  savePf(); renderPortfolio();
  ['pf-code','pf-name','pf-qty','pf-price'].forEach(id=>document.getElementById(id).value='');
}

function removeHolding(id) {
  if(!confirm('삭제하시겠습니까?')) return;
  portfolio=portfolio.filter(h=>h.id!==id);
  savePf(); renderPortfolio();
}

function exportPortfolio() {
  const blob=new Blob([JSON.stringify({holdings:portfolio.map(h=>({code:h.code,name:h.name,qty:h.qty,avg_price:h.avg_price}))},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='portfolio_config.json'; a.click();
}

function importPortfolio(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.holdings) throw new Error();
      portfolio=d.holdings.map(h=>({...h,id:h.id||Date.now().toString()+Math.random()}));
      savePf(); renderPortfolio(); alert('가져오기 완료');
    }catch{alert('올바른 포트폴리오 파일이 아닙니다');}
  };
  reader.readAsText(file);
}

async function getApprovalKey() {
  if (wsApprovalKey) return wsApprovalKey;
  // localStorage 캐시
  const lsKey    = localStorage.getItem('ki_approval');
  const lsExpiry = parseInt(localStorage.getItem('ki_approval_exp') || '0');
  const lsAppKey = localStorage.getItem('ki_approval_key');
  if (lsKey && Date.now() < lsExpiry && lsAppKey === rtAppKey) {
    wsApprovalKey = lsKey;
    return wsApprovalKey;
  }
  // 신규 발급
  const res = await fetch(`${KI_API}/oauth2/Approval`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ grant_type: 'client_credentials', appkey: rtAppKey, secretkey: rtAppSecret }),
  });
  const d = await res.json();
  if (!d.approval_key) throw new Error('Approval key 발급 실패');
  wsApprovalKey = d.approval_key;
  const exp = Date.now() + 23 * 3600 * 1000;
  localStorage.setItem('ki_approval',     wsApprovalKey);
  localStorage.setItem('ki_approval_exp', String(exp));
  localStorage.setItem('ki_approval_key', rtAppKey);
  return wsApprovalKey;
}

async function connectWebSocket() {
  if (wsConn && (wsConn.readyState === WebSocket.OPEN || wsConn.readyState === WebSocket.CONNECTING)) return;
  if (!rtAppKey || !rtAppSecret) { setMktStatus('설정 탭에서 API 키를 먼저 입력하세요'); return; }
  try {
    const approvalKey = await getApprovalKey();
    wsConn = new WebSocket('wss://ops.koreainvestment.com:21000');
    wsConn._key = approvalKey;

    wsConn.onopen = () => {
      setMktStatus('🟢 WebSocket 연결됨 — 실시간 체결 수신 중');
      watchlist.forEach(w => wsSubscribe(w.code));
    };

    wsConn.onmessage = (evt) => {
      const raw = evt.data;
      // JSON 제어 메시지 (PINGPONG 등)
      if (raw[0] === '{') {
        try {
          const msg = JSON.parse(raw);
          if (msg.header?.tr_id === 'PINGPONG') wsConn.send(raw);
        } catch {}
        return;
      }
      // pipe-delimited 실시간 데이터: {type}|{trId}|[{cnt}|]{data}
      const parts = raw.split('|');
      if (parts.length < 3 || parts[1] !== 'H0STCNT0') return;
      // cnt 필드가 있는 경우(parts[2]가 숫자)는 parts[3], 없으면 parts[2]
      const body = isNaN(parts[2]) ? parts[2] : (parts[3] || '');
      if (!body) return;
      const f = body.split('^');
      if (f.length < 14) return;
      const code = f[0];
      wsPrices[code] = {
        time: f[1],
        price: parseInt(f[2]),
        sign: f[3],   // 1:상한 2:상승 3:보합 4:하한 5:하락
        change: parseInt(f[4]),
        changePct: parseFloat(f[5]),
        volume: parseInt(f[13]),
      };
      if (mktTab === 'watch') renderWatchlist();
    };

    wsConn.onerror = () => setMktStatus('🔴 WebSocket 연결 오류');
    wsConn.onclose = () => setMktStatus('⚫ WebSocket 연결 끊김');
  } catch (e) {
    setMktStatus(`WebSocket 오류: ${e.message}`);
  }
}

function wsSubscribe(code) {
  if (!wsConn || wsConn.readyState !== WebSocket.OPEN) return;
  wsConn.send(JSON.stringify({
    header: { approval_key: wsConn._key, custtype: 'P', tr_type: '1', 'content-type': 'utf-8' },
    body: { input: { tr_id: 'H0STCNT0', tr_key: code } },
  }));
}

function wsUnsubscribe(code) {
  if (!wsConn || wsConn.readyState !== WebSocket.OPEN) return;
  wsConn.send(JSON.stringify({
    header: { approval_key: wsConn._key, custtype: 'P', tr_type: '2', 'content-type': 'utf-8' },
    body: { input: { tr_id: 'H0STCNT0', tr_key: code } },
  }));
}

function disconnectWebSocket() {
  if (wsConn) { wsConn.close(); wsConn = null; }
  wsApprovalKey = null;
}

function watchlistFormHtml() {
  return `<div style="background:var(--bg2);border-radius:10px;padding:12px;margin-top:12px">
    <div style="font-size:13px;color:var(--pu);margin-bottom:8px;font-weight:600">➕ 관심종목 추가 (최대 40종목)</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <input id="ws-query" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)"
        style="flex:1;min-width:160px;padding:9px 12px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px"
        oninput="wsShowSuggestions(this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addToWatchlist()}">
      <button class="btn btn-green btn-sm" onclick="addToWatchlist()" style="white-space:nowrap">추가</button>
    </div>
    <div id="ws-suggestions"></div>
  </div>`;
}

function renderWatchlist() {
  const el = document.getElementById('mkt-content');
  if (!watchlist.length) {
    el.innerHTML = '<div class="empty" style="margin-bottom:0">관심종목이 없습니다</div>' + watchlistFormHtml();
    return;
  }
  el.innerHTML = watchlist.map(item => {
    const rt = wsPrices[item.code];
    const up = rt && rt.changePct > 0, dn = rt && rt.changePct < 0;
    const clr = up ? 'var(--rd)' : dn ? '#4488ff' : 'var(--tx2)';
    const arrow = up ? '▲' : dn ? '▼' : '—';
    return `<div class="all-item" style="border-left-color:${rt ? clr : 'var(--bd)'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <span style="font-weight:700;font-size:14px">${item.name}</span>
          <span style="color:var(--tx2);font-size:11px;margin-left:4px">${item.code}</span>
          ${rt ? '<span style="font-size:10px;color:#00cc66;margin-left:4px">● LIVE</span>' : '<span style="font-size:10px;color:var(--tx2);margin-left:4px">대기중</span>'}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="text-align:right">
            <div style="font-size:14px;font-weight:700">${rt ? rt.price.toLocaleString()+'원' : '—'}</div>
            ${rt ? `<div style="font-size:12px;color:${clr}">${arrow}${Math.abs(rt.changePct).toFixed(2)}% (${rt.change>=0?'+':''}${rt.change.toLocaleString()})</div>` : ''}
          </div>
          <button class="btn btn-red btn-sm" onclick="removeFromWatchlist('${item.code}')">✕</button>
        </div>
      </div>
      ${rt ? `<div style="font-size:11px;color:var(--tx2);margin-top:3px">거래량 ${rt.volume.toLocaleString()} · ${rt.time.replace(/(\d{2})(\d{2})(\d{2})/,'$1:$2:$3')}</div>` : ''}
    </div>`;
  }).join('') + watchlistFormHtml();
}

function wsLookupByName(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const seen = {};
  const pool = (allStocks || []).concat(results.signals || []);
  const deduped = pool.filter(s => s.code && s.name && !seen[s.code] && (seen[s.code] = 1));
  const exact = deduped.filter(s => s.name.toLowerCase() === q);
  if (exact.length) return exact;
  return deduped.filter(s => s.name.toLowerCase().includes(q));
}

function wsShowSuggestions(val) {
  const el = document.getElementById('ws-suggestions');
  if (!el) return;
  const q = (val || '').trim();
  if (!q || /^\d{1,6}$/.test(q)) { el.innerHTML = ''; return; }
  const matches = wsLookupByName(q);
  if (!matches.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">` +
    matches.slice(0, 12).map(s =>
      `<button onclick="wsAddDirect('${s.code}','${s.name.replace(/'/g,"&#39;")}')"
        style="padding:5px 10px;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:12px;cursor:pointer">
        ${s.name} <span style="color:var(--tx2)">${s.code}</span>
       </button>`
    ).join('') + `</div>`;
}

function wsAddDirect(code, name) {
  if (watchlist.find(w => w.code === code)) { alert('이미 추가된 종목입니다'); return; }
  if (watchlist.length >= 40) { alert('관심종목은 최대 40개까지 가능합니다'); return; }
  watchlist.push({ code, name });
  localStorage.setItem('mkt_watchlist', JSON.stringify(watchlist));
  wsSubscribe(code);
  renderWatchlist();
}

function addToWatchlist() {
  const q = (document.getElementById('ws-query')?.value || '').trim();
  if (!q) { alert('종목코드 또는 종목명을 입력하세요'); return; }
  if (/^\d{6}$/.test(q)) {
    const found = (allStocks || []).find(s => s.code === q) || (results.signals || []).find(s => s.code === q);
    wsAddDirect(q, found ? found.name : q);
    return;
  }
  const matches = wsLookupByName(q);
  if (!matches.length) { alert('종목을 찾을 수 없습니다\n6자리 종목코드로 입력해보세요'); return; }
  if (matches.length === 1) { wsAddDirect(matches[0].code, matches[0].name); return; }
  wsShowSuggestions(q);
}

function removeFromWatchlist(code) {
  wsUnsubscribe(code);
  delete wsPrices[code];
  watchlist = watchlist.filter(w => w.code !== code);
  localStorage.setItem('mkt_watchlist', JSON.stringify(watchlist));
  renderWatchlist();
}

// ── 시장탭 공통 제어 ──────────────────────────────────────────────────────────
function setMktTab(tab, btn) {
  mktTab = tab;
  document.querySelectorAll('.mkt-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const mktBtns = document.getElementById('mkt-market-btns');
  if (mktBtns) mktBtns.style.display = tab === 'watch' ? 'none' : 'flex';
  loadMarketTab();
}

function setMktMarket(code, btn) {
  mktMarket = code;
  document.querySelectorAll('.mkt-mkt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadMarketTab();
}

async function loadMarketTab() {
  if (mktTab === 'watch') {
    renderWatchlist();
    if (!wsConn || wsConn.readyState !== WebSocket.OPEN) {
      if (!rtAppKey || !rtAppSecret) {
        setMktStatus('관심종목 실시간은 설정 탭에서 API 키 입력 후 사용 가능합니다');
      } else {
        await connectWebSocket();
      }
    }
    return;
  }
  // 상승/하락/거래량 — JSON 파일에서 읽기
  document.getElementById('mkt-content').innerHTML = '<div class="empty">로딩 중...</div>';
  const data = await fetchRankingFromJson();
  if (!data) {
    document.getElementById('mkt-content').innerHTML =
      '<div class="empty">데이터 없음<br><small style="color:var(--tx2)">GitHub Actions 스캔 후 표시됩니다 (장중 30분마다)</small></div>';
    return;
  }
  const market = mktMarket === 'J' ? 'kospi' : 'kosdaq';
  renderRanking(data[market]?.[mktTab] || []);
  setMktStatus(`GitHub Actions 업데이트: ${data.update_time}`);
}

function startMarketPolling() {
  mktRankingCache = null; // 탭 진입 시 캐시 초기화 → 최신 JSON 로드
  loadMarketTab();
  if (mktInterval) clearInterval(mktInterval);
  mktInterval = setInterval(() => { if (mktTab !== 'watch') loadMarketTab(); }, 300000); // 5분마다
}

function stopMarketPolling() {
  if (mktInterval) { clearInterval(mktInterval); mktInterval = null; }
  if (mktTab === 'watch') disconnectWebSocket();
}

// ── Init ─────────────────────────────────────────────────────────────────────
if(localStorage.getItem('pin_hash')) {
  document.getElementById('pin-desc').textContent='PIN을 입력하세요';
} else {
  document.getElementById('pin-hint').textContent='※ 처음 사용: 원하는 PIN 4자리를 입력해 설정하세요';
}
// 키보드 지원
document.addEventListener('keydown', e=>{
  if(document.getElementById('pin-screen').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') pinKey(e.key);
  else if(e.key==='Backspace') pinKey('C');
  else if(e.key==='Enter') pinKey('OK');
});
</script>
