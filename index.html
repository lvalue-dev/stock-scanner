      { code: "161390", name: "한국타이어앤테크놀로지" },
      { code: "180640", name: "한진칼" },
    ];

    // ── Technical Analysis ──────────────────────────────────────────────────

    function calcEMA(prices, period) {
      if (prices.length < period) return prices[prices.length - 1];
      const k = 2 / (period + 1);
      let ema = prices.slice(0, period).reduce((a, b) => a + b) / period;
      for (let i = period; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
      return ema;
    }

    function calcRSI(prices, period = 14) {
      if (prices.length < period + 1) return null;
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const d = prices[i] - prices[i - 1];
        if (d > 0) gains += d; else losses -= d;
      }
      let avgG = gains / period, avgL = losses / period;
      for (let i = period + 1; i < prices.length; i++) {
        const d = prices[i] - prices[i - 1];
        avgG = (avgG * (period - 1) + Math.max(d, 0)) / period;
        avgL = (avgL * (period - 1) + Math.max(-d, 0)) / period;
      }
      return avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);
    }

    function calcMACD(prices) {
      if (prices.length < 35) return null;
      const macdLine = [];
      for (let i = 25; i < prices.length; i++) {
        const s = prices.slice(0, i + 1);
        macdLine.push(calcEMA(s, 12) - calcEMA(s, 26));
      }
      if (macdLine.length < 9) return null;
      const sigLine = [];
      for (let i = 8; i < macdLine.length; i++)
        sigLine.push(calcEMA(macdLine.slice(0, i + 1), 9));
      if (sigLine.length < 2) return null;
      const cm = macdLine[macdLine.length - 1], pm = macdLine[macdLine.length - 2];
      const cs = sigLine[sigLine.length - 1], ps = sigLine[sigLine.length - 2];
      return { goldenCross: pm <= ps && cm > cs, macd: cm, signal: cs };
    }

    function check3Rise(candles) {
      if (candles.length < 3) return false;
      const [c1, c2, c3] = candles.slice(-3);
      return c1.close > c1.open && c2.close > c2.open && c3.close > c3.open
          && c2.close > c1.close && c3.close > c2.close;
    }

    function analyzeStock(data) {
      const raw = data?.output2;
      if (!raw || raw.length < 30) return null;
      const candles = [...raw].reverse().map(d => ({
        open: parseFloat(d.stck_oprc), close: parseFloat(d.stck_clpr),
        high: parseFloat(d.stck_hgpr), low: parseFloat(d.stck_lwpr),
      }));
      const closes = candles.map(c => c.close);
      const rsi = calcRSI(closes);
      const macdRes = calcMACD(closes);
      const rise3 = check3Rise(candles);
      const signals = [];
      if (rsi !== null && rsi <= 30) signals.push(`RSI과매도(${rsi.toFixed(1)})`);
      if (macdRes?.goldenCross) signals.push("MACD골든크로스");
      if (rise3) signals.push("3봉상승");
      if (!signals.length) return null;
      const conf = Math.min(99, signals.length * 25 + (rsi ? Math.max(0, 30 - rsi) : 0));
      return { price: closes[closes.length - 1], rsi: rsi?.toFixed(1) ?? "N/A", signals, confidence: conf.toFixed(0) };
    }

    async function sendDiscord(url, stock, a) {
      await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [{ title: `📊 ${stock.name} (${stock.code})`, color: 0x00cc66,
          fields: [
            { name: "가격", value: `${a.price.toLocaleString()}원`, inline: true },
            { name: "RSI", value: a.rsi, inline: true },
            { name: "신뢰도", value: `${a.confidence}%`, inline: true },
            { name: "신호", value: a.signals.join(", "), inline: false },
          ], timestamp: new Date().toISOString() }] }),
      });
    }

    // ── Styles ──────────────────────────────────────────────────────────────

    const S = {
      wrap: { fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", maxWidth: 480, margin: "0 auto", background: "#0d0d1f", minHeight: "100vh", color: "#dde1f0" },
      header: { background: "linear-gradient(135deg,#1a1a40,#2a2a60)", padding: "18px 16px 14px", borderBottom: "1px solid #2a2a4a" },
      title: { fontSize: 20, fontWeight: 700, color: "#8080ff" },
      sub: { fontSize: 12, color: "#6668aa", marginTop: 4 },
      tabs: { display: "flex", background: "#12122a", borderBottom: "1px solid #2a2a4a" },
      tab: a => ({ flex: 1, padding: "12px 4px", fontSize: 13, fontWeight: a ? 700 : 400, color: a ? "#8080ff" : "#666", background: "none", border: "none", borderBottom: a ? "2px solid #8080ff" : "2px solid transparent", cursor: "pointer" }),
      body: { padding: 16 },
      label: { display: "block", fontSize: 12, color: "#6668aa", marginBottom: 4 },
      input: { width: "100%", padding: "11px 12px", background: "#1a1a38", border: "1px solid #2a2a50", borderRadius: 8, color: "#dde1f0", fontSize: 14, marginBottom: 14 },
      btn: v => ({ width: "100%", padding: "14px", borderRadius: 10, border: "none", fontSize: 16, fontWeight: 700, cursor: "pointer", background: v === "stop" ? "#cc3333" : v === "save" ? "#2255cc" : "#1a7a44", color: "#fff", marginTop: 6 }),
      pbar: { background: "#1a1a38", borderRadius: 4, height: 8, marginBottom: 4, overflow: "hidden" },
      pfill: p => ({ width: `${p}%`, height: "100%", background: "linear-gradient(90deg,#4444cc,#8080ff)", borderRadius: 4, transition: "width 0.4s ease" }),
      card: { background: "#14143a", borderRadius: 10, padding: "14px 14px 10px", marginBottom: 12, borderLeft: "3px solid #00cc66" },
      badge: c => ({ display: "inline-block", padding: "3px 9px", borderRadius: 20, fontSize: 11, background: c + "22", color: c, marginRight: 4, marginTop: 6 }),
      logBox: { background: "#080818", borderRadius: 8, padding: "10px 12px", height: 320, overflowY: "auto", fontFamily: "monospace", fontSize: 12 },
      logLine: { padding: "3px 0", borderBottom: "1px solid #12122a", color: "#99a" },
      err: { background: "#330a0a", border: "1px solid #cc3333", borderRadius: 8, padding: "12px 14px", color: "#ff8888", fontSize: 13, marginBottom: 14 },
      empty: { textAlign: "center", color: "#555", padding: "48px 20px", fontSize: 14 },
      info: { fontSize: 12, color: "#555", lineHeight: 1.9, marginTop: 20 },
    };

    // ── Component ────────────────────────────────────────────────────────────

    function StockScanner() {
      const ls = (k, d = "") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };

      const [tab, setTab] = useState("scanner");
      const [appKey, setAppKey] = useState(() => ls("ki_appkey"));
      const [appSecret, setAppSecret] = useState(() => ls("ki_secret"));
      const [discordUrl, setDiscordUrl] = useState(() => ls("ki_discord"));
      const [scanning, setScanning] = useState(false);
      const [progress, setProgress] = useState(0);
      const [results, setResults] = useState([]);
      const [logs, setLogs] = useState([]);
      const [errMsg, setErrMsg] = useState("");
      const stopRef = useRef(false);

      const addLog = useCallback(msg => {
        const t = new Date().toLocaleTimeString("ko-KR");
        setLogs(prev => [`[${t}] ${msg}`, ...prev].slice(0, 200));
      }, []);

      const saveSettings = () => {
        try {
          localStorage.setItem("ki_appkey", appKey);
          localStorage.setItem("ki_secret", appSecret);
          localStorage.setItem("ki_discord", discordUrl);
        } catch {}
      };

      const getToken = async () => {
        const res = await fetch(`${API_BASE}/oauth2/tokenP`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ grant_type: "client_credentials", appkey: appKey, appsecret: appSecret }),
        });
        if (!res.ok) throw new Error(`토큰 HTTP ${res.status}`);
        const d = await res.json();
        if (!d.access_token) throw new Error("토큰 없음: " + JSON.stringify(d));
        return d.access_token;
      };

      const fetchPrice = async (token, code) => {
        const p = new URLSearchParams({ fid_cond_mrkt_div_code: "J", fid_input_iscd: code, fid_org_adj_prc: "0", fid_period_div_code: "D" });
        const res = await fetch(`${API_BASE}/uapi/domestic-stock/v1/quotations/inquire-daily-price?${p}`, {
          headers: { authorization: `Bearer ${token}`, appkey: appKey, appsecret: appSecret, tr_id: "FHKST01010400", custtype: "P" },
        });
        if (!res.ok) throw new Error(`조회 HTTP ${res.status}`);
        const data = await res.json();
        if (data.rt_cd !== "0") throw new Error(`API [${data.rt_cd}] ${data.msg1 ?? data.msg_cd ?? "오류"}`);
        return data;
      };

      const startScan = async () => {
        if (!appKey || !appSecret) { setErrMsg("설정 탭에서 App Key와 Secret을 입력하세요."); setTab("settings"); return; }
        saveSettings();
        setScanning(true); stopRef.current = false;
        setResults([]); setLogs([]); setErrMsg(""); setProgress(0);
        try {
          addLog("토큰 발급 중...");
          const token = await getToken();
          addLog("✅ 토큰 발급 완료");
          for (let i = 0; i < STOCKS.length; i++) {
            if (stopRef.current) { addLog("⏹ 스캔 중단"); break; }
            const stock = STOCKS[i];
            setProgress(Math.round(((i + 1) / STOCKS.length) * 100));
            addLog(`🔍 ${stock.name} 분석 중...`);
            try {
              const data = await fetchPrice(token, stock.code);
              const analysis = analyzeStock(data);
              if (analysis) {
                addLog(`🎯 신호: ${stock.name} — ${analysis.signals.join(", ")}`);
                setResults(prev => [...prev, { stock, analysis }]);
                if (discordUrl) {
                  try { await sendDiscord(discordUrl, stock, analysis); addLog(`📨 Discord: ${stock.name}`); }
                  catch (e) { addLog(`⚠️ Discord 오류: ${e.message}`); }
                }
              }
              await new Promise(r => setTimeout(r, 250));
            } catch (e) { addLog(`⚠️ ${stock.name}: ${e.message}`); }
          }
          if (!stopRef.current) { addLog(`✅ 완료`); setProgress(100); }
        } catch (e) { setErrMsg(e.message); addLog(`❌ ${e.message}`); }
        finally { setScanning(false); }
      };

      return (
        <div style={S.wrap}>
          <div style={S.header}>
            <div style={S.title}>📈 주식 스캐너</div>
            <div style={S.sub}>한국투자 Open API · RSI / MACD / 3봉 패턴</div>
          </div>

          <div style={S.tabs}>
            {[["scanner","스캔"],["results",`결과(${results.length})`],["settings","설정"],["log","로그"]].map(([id,label]) => (
              <button key={id} style={S.tab(tab===id)} onClick={() => setTab(id)}>{label}</button>
            ))}
          </div>

          <div style={S.body}>
            {errMsg && <div style={S.err}>⚠️ {errMsg}</div>}

            {tab === "scanner" && (
              <div>
                <div style={S.pbar}><div style={S.pfill(progress)} /></div>
                <div style={{ textAlign:"right", fontSize:11, color:"#555", marginBottom:16 }}>{progress}% · {STOCKS.length}종목</div>
                {scanning
                  ? <button style={S.btn("stop")} onClick={() => stopRef.current = true}>⏹ 스캔 중단</button>
                  : <button style={S.btn("start")} onClick={startScan}>🚀 스캔 시작</button>
                }
                <div style={S.info}>
                  분석 조건<br/>
                  • RSI(14) ≤ 30 — 과매도 구간<br/>
                  • MACD 골든크로스 — 추세 전환<br/>
                  • 3봉 연속 양봉 상승<br/>
                  • 대상: KOSPI 주요 50 종목
                </div>
                {logs[0] && <div style={{ marginTop:12, fontSize:12, color:"#555" }}>{logs[0]}</div>}
              </div>
            )}

            {tab === "results" && (
              <div>
                {results.length === 0
                  ? <div style={S.empty}>{scanning ? "🔍 스캔 중..." : "신호 없음\n스캔 탭에서 시작하세요."}</div>
                  : results.map((r, i) => (
                    <div key={i} style={S.card}>
                      <div style={{ fontSize:15, fontWeight:700, marginBottom:6 }}>
                        {r.stock.name} <span style={{ fontWeight:400, color:"#666", fontSize:12 }}>({r.stock.code})</span>
                      </div>
                      <div>
                        <span style={{ fontSize:22, fontWeight:700, color:"#00ff88" }}>{r.analysis.price.toLocaleString()}원</span>
                        <span style={{ fontSize:12, color:"#888", marginLeft:10 }}>RSI {r.analysis.rsi}</span>
                      </div>
                      <div>
                        {r.analysis.signals.map((s, j) => <span key={j} style={S.badge("#8080ff")}>{s}</span>)}
                        <span style={S.badge("#00cc66")}>신뢰도 {r.analysis.confidence}%</span>
                      </div>
                    </div>
                  ))
                }
              </div>
            )}

            {tab === "settings" && (
              <div>
                <label style={S.label}>App Key</label>
                <input style={S.input} type="password" value={appKey} onChange={e => setAppKey(e.target.value)} placeholder="한국투자 App Key" />
                <label style={S.label}>App Secret</label>
                <input style={S.input} type="password" value={appSecret} onChange={e => setAppSecret(e.target.value)} placeholder="한국투자 App Secret" />
                <label style={S.label}>Discord Webhook URL (선택)</label>
                <input style={S.input} type="password" value={discordUrl} onChange={e => setDiscordUrl(e.target.value)} placeholder="https://discord.com/api/webhooks/..." />
                <button style={S.btn("save")} onClick={() => { saveSettings(); setErrMsg(""); addLog("✅ 설정 저장됨"); setTab("scanner"); }}>
                  💾 저장하고 스캔으로 이동
                </button>
                <div style={S.info}>
                  • API Key는 기기 로컬에만 저장됩니다.<br/>
                  • 한국투자 Open API: securities.koreainvestment.com<br/>
                  • 모의투자 계좌로도 동일하게 사용 가능합니다.<br/>
                  • CORS 오류 시 아래 Python 스크립트 또는 GitHub Actions를 이용하세요.
                </div>
              </div>
            )}

            {tab === "log" && (
              <div>
                <div style={S.logBox}>
                  {logs.length === 0
                    ? <div style={{ color:"#444", padding:8 }}>로그 없음</div>
                    : logs.map((l, i) => <div key={i} style={S.logLine}>{l}</div>)
                  }
                </div>
                {logs.length > 0 && (
                  <button style={{ ...S.btn("stop"), marginTop:10, padding:"10px", fontSize:13 }} onClick={() => setLogs([])}>
                    🗑 로그 지우기
                  </button>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StockScanner />);
  </script>
</body>
